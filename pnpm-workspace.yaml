packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
  - 'docs'


# Versions des paquets du nouveau front, épinglées exactement (`"react": "catalog:"`).
# apps/web garde ses propres versions (Next 14, React 18) jusqu'à sa suppression.
# Mise à jour : skill clair-deps.
catalog:
  "@axe-core/playwright": 4.14.0
  "@biomejs/biome": 2.6.3
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  "@fontsource-variable/inter": 5.3.0
  "@mantine/charts": 9.7.4
  "@mantine/core": 9.7.4
  "@mantine/dates": 9.7.4
  "@mantine/hooks": 9.7.4
  "@playwright/test": 1.64.1
  "@storybook/addon-a11y": 10.6.3
  "@storybook/addon-docs": 10.6.3
  "@storybook/addon-links": 10.6.3
  "@storybook/addon-mcp": 10.6.3
  "@storybook/addon-themes": 10.6.3
  "@storybook/addon-vitest": 10.6.3
  "@storybook/react-vite": 10.6.3
  "@tanstack/react-query": 5.104.5
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.8
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  "@vitest/browser": 5.0.5
  "@vitest/browser-playwright": 5.0.5
  dayjs: 1.11.23
  happy-dom: 21.0.4
  lefthook: 2.2.2
  lucide-react: 1.61.0
  next: 16.4.3
  openapi-typescript: 7.13.0
  postcss: 8.5.31
  postcss-preset-mantine: 1.18.0
  postcss-simple-vars: 7.0.1
  react: 19.3.1
  react-dom: 19.3.1
  recharts: 3.10.1
  storybook: 10.6.3
  tsafe: 1.8.12
  typescript: 6.0.3
  vite: 8.3.5
  vitest: 5.0.5

# lucide-react et @types/react existent en deux versions (apps/web en React 18, le nouveau front en
# React 19). Hissée dans node_modules/.pnpm/node_modules, c'est la version du nouveau front que
# apps/web trouvait : lucide 1.x sans les icônes de marque (Github…) pour l'optimisation des imports
# de Next 14, @types/react 19 pour les bibliothèques qui ne déclarent pas leurs types (type-check du
# build en échec). Aucune des deux n'est hissée : chacun garde la sienne.
hoistPattern:
  - '*'
  - '!lucide-react'
  - '!@types/react'
  - '!@types/react-dom'

# Bibliothèques d'apps/web qui importent les types de React sans déclarer @types/react : ce pair
# optionnel leur donne le @types/react 18 de apps/web, à la place du @types/react hissé. Versions
# exactes, pour ne rien changer au nouveau front. styled-jsx est exclu : le réécrire ferait aussi
# brancher son pair optionnel @babel/core.
packageExtensions:
  "@tanstack/react-query@5.90.16": &typesReact18
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  "framer-motion@10.18.0": *typesReact18
  "lucide-react@0.298.0": *typesReact18
  "next-themes@0.4.6": *typesReact18
  "next@14.0.4": *typesReact18
  "react-dom@18.3.1": *typesReact18
  "react-smooth@4.0.4": *typesReact18
  "react-transition-group@4.4.5": *typesReact18
  "recharts@2.15.4": *typesReact18
  "use-debounce@10.0.6": *typesReact18
  "use-sync-external-store@1.6.0": *typesReact18

# Scripts d'installation autorisés (pnpm 12 refuse les autres en CI et en Docker).
allowBuilds:
  lefthook: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  # Binaire natif de secours d'eslint-import-resolver (apps/web) : inutile, ignoré explicitement.
  unrs-resolver: false

# Ajouté le 26/10/2026 : Mantine 9.7.4 a été publiée le 25/10/2026 à 20 h 15 (UTC), moins d'un jour
# avant son adoption, et pnpm 12 refuse une version plus récente que son âge minimal de publication
# (minimumReleaseAge, un jour par défaut). À retirer depuis le 26/10/2026 au soir, quand cet âge est
# atteint, et au plus tard à la prochaine montée de Mantine (skill clair-deps) : passé ce délai,
# l'exclusion ne sert plus à rien.
minimumReleaseAgeExclude:
  - "@mantine/core@9.7.4"
  - "@mantine/hooks@9.7.4"
  - "@mantine/charts@9.7.4"
  - "@mantine/dates@9.7.4"
