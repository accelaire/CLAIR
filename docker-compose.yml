# version: '3.8'

services:
  # ==========================================================================
  # PostgreSQL - Base de données principale
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: clair-postgres
    environment:
      POSTGRES_USER: clair
      POSTGRES_PASSWORD: clair_dev
      POSTGRES_DB: clair
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clair"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clair-network

  # ==========================================================================
  # Redis - Cache et queues
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: clair-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clair-network


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  clair-network:
    driver: bridge
