name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version lue dans packageManager (package.json)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # ESLint de l'existant ; Biome (nouveau front et outillage) tourne une seule fois, dans le job front.
      - name: Lint
        run: pnpm lint

      # Type check désactivé temporairement - erreurs pré-existantes dans ingestion/web
      # - name: Type check
      #   run: pnpm type-check

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          NODE_ENV: test

      - name: Run tests with coverage
        run: pnpm --filter @clair/api test -- --coverage
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: github.event_name == 'pull_request'
        with:
          files: ./apps/api/coverage/coverage-final.json
          flags: api
          fail_ci_if_error: false
        continue-on-error: true

  front:
    # Nouveau front : packages/*, apps/site (types), Storybook (stories rendues dans Chromium + axe).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version lue dans packageManager (package.json)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm check

      - name: Types et tests des packages
        run: |
          pnpm --filter "./packages/**" --filter @clair/storybook --filter @clair/site type-check
          pnpm --filter "./packages/**" test

      - name: Navigateur des tests de stories
        run: pnpm --filter @clair/storybook exec playwright install --with-deps chromium

      - name: Stories (rendu + accessibilité)
        run: pnpm --filter @clair/storybook test:stories

      - name: Build Storybook
        run: pnpm --filter @clair/storybook build

  e2e-site:
    # Tests de fumée de apps/site (e2e/site.*.spec.ts) : build, `next start` et faux serveur d'API
    # local (e2e/fake-api.mjs). Ni l'API de production ni la doc (dont le build la télécharge).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version lue dans packageManager (package.json)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sans NEXT_PUBLIC_API_URL ni API_URL : l'adresse de l'API est lue au démarrage
      # (API_URL du serveur web de playwright.config.ts), pas figée dans le build.
      - name: Build du site
        run: pnpm --filter @clair/site build

      - name: Navigateur
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests e2e du site
        run: pnpm test:e2e --project=site

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-site
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    # Le build de @clair/web prérend /sitemap.xml, qui interroge l'API. Depuis
    # que `fetchSitemapData` lève au lieu de dégrader (à dessein : un sitemap
    # vide serait ensuite figé 24 h par l'ISR), un build sans API échoue.
    #
    # On monte donc une vraie API devant une base vide. Ça ne valide pas le
    # CONTENU du sitemap — sans données il se réduit à ses 17 pages statiques —
    # mais ça valide la plomberie : l'API démarre, répond, le JSON parse, le
    # sitemap se construit. Le prérendu ne touche que 4 endpoints (/sitemap ×2,
    # /groupes, /scrutins/annees) : les pages de détail sont rendues à la demande.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clair
          POSTGRES_PASSWORD: clair_dev
          POSTGRES_DB: clair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clair"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # L'API enregistre le plugin Redis au démarrage, et le rate-limit en
      # dépend. Sans Redis elle démarre quand même, mais en logguant une erreur
      # de connexion par requête.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://clair:clair_dev@localhost:5432/clair
      REDIS_URL: redis://localhost:6379
      # Le tier anonyme est plafonné à 10 req/min. Le build en consomme 6, donc
      # la marge est mince et un fetch de plus au prérendu suffirait à déclencher
      # un 429 — qui, sur /sitemap.xml, repasserait le build au rouge. Le secret
      # place ces appels dans le tier interne, exempté. Valeur en clair assumée :
      # cette API est éphémère, locale au runner, et n'expose qu'une base vide.
      CLAIR_INTERNAL_SECRET: ci-build-not-a-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version lue dans packageManager (package.json)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # `db push` et non `migrate deploy` : l'historique de migrations n'est pas
      # rejouable depuis une base vierge (20260313_add_sujets référence
      # `dossiers_legislatifs`, créée plus tard). La prod, elle, a été construite
      # incrémentalement et n'a jamais rejoué cet historique.
      #
      # Ici on ne cherche qu'un schéma conforme à schema.prisma pour faire vivre
      # l'API : `db push` le donne directement. Rendre l'historique rejouable est
      # un chantier à part.
      #
      # `db push` ignore les triggers : `db:triggers` pose ceux qui tiennent
      # `updated_at` (prisma/triggers.sql), sans quoi la base de la CI ne se
      # comporterait pas comme la prod.
      - name: Apply database schema
        run: |
          pnpm --filter @clair/api exec prisma db push --skip-generate
          pnpm --filter @clair/api db:triggers

      - name: Build API
        run: pnpm build:api

      - name: Start API
        run: |
          nohup node apps/api/dist/index.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "API prête après ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::L'API n'a pas démarré en 30 s"
          cat /tmp/api.log
          exit 1

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      # Le build de /sitemap.xml passe par l'API : si quelque chose a mal tourné
      # de ce côté, le log de l'API le dit mieux que la trace Next.
      - name: API logs
        if: failure()
        run: cat /tmp/api.log
